name: Recession Data Pull (Manual)

on:
  workflow_dispatch:

jobs:
  run-recession-pull:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install pandas pandas_datareader

      - name: Run script
        run: python recessionDataPulls.py

      - name: Upload CSV artifact
        uses: actions/upload-artifact@v4
        with:
          name: yield-curve-spreads
          path: "*.csv"
          retention-days: 30
